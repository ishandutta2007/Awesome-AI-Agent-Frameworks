<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#0e1224"/>
      <stop offset="100%" stop-color="#140a28"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(2deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(14px) rotate(-2deg); }
      }
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 400; opacity: 0.2; }
        50% { opacity: 0.9; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }
      @keyframes radarPulse {
        0% { r: 10px; opacity: 0.8; }
        100% { r: 90px; opacity: 0; }
      }
      .animated-float-1 { animation: float1 7s ease-in-out infinite; }
      .animated-float-2 { animation: float2 9s ease-in-out infinite; }
      .animated-beam {
        stroke-dasharray: 80 120;
        animation: pulseBeam 5s linear infinite;
      }
      .animated-radar {
        animation: radarPulse 3.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Subtle Dynamic Background Elements (Behind Foreground) -->
  <g opacity="0.45">
    <!-- Ambient glowing orbs -->
    <circle cx="150" cy="80" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
    <circle cx="1050" cy="280" r="160" fill="#ec4899" opacity="0.12" filter="url(#glow)"/>
    <circle cx="980" cy="80" r="100" fill="#06b6d4" opacity="0.1" filter="url(#glow)"/>

    <!-- Dynamic Flow Beams in background -->
    <path d="M -50 180 Q 300 40 600 180 T 1250 180" fill="none" stroke="url(#primary-glow)" stroke-width="2.5" class="animated-beam"/>
    <path d="M -50 260 Q 400 340 800 240 T 1250 100" fill="none" stroke="url(#cyan-glow)" stroke-width="2" class="animated-beam" style="animation-duration: 7s;"/>

    <!-- Radar Nodes in Corners (safe distance from text) -->
    <g transform="translate(1080, 70)">
      <circle cx="0" cy="0" r="6" fill="#ec4899"/>
      <circle cx="0" cy="0" fill="none" stroke="#ec4899" stroke-width="1.5" class="animated-radar"/>
      <circle cx="0" cy="0" fill="none" stroke="#ec4899" stroke-width="1" class="animated-radar" style="animation-delay: 1.5s;"/>
    </g>
    <g transform="translate(100, 300)">
      <circle cx="0" cy="0" r="5" fill="#6366f1"/>
      <circle cx="0" cy="0" fill="none" stroke="#6366f1" stroke-width="1.5" class="animated-radar" style="animation-delay: 0.8s;"/>
    </g>
  </g>

  <!-- Left Dynamic Floating Pill (Edge positioned) -->
  <g class="animated-float-1" transform="translate(60, 40)" opacity="0.85">
    <rect width="180" height="38" rx="19" fill="#1e2238" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="6" fill="#10b981"/>
    <text x="36" y="24" class="badge-text">Autonomous Agents</text>
  </g>

  <!-- Right Dynamic Floating Pill (Edge positioned) -->
  <g class="animated-float-2" transform="translate(940, 280)" opacity="0.85">
    <rect width="195" height="38" rx="19" fill="#1e2238" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="6" fill="#38bdf8"/>
    <text x="36" y="24" class="badge-text">Multi-Agent Systems</text>
  </g>

  <!-- Foreground Content Area: Clear, legible and never blocked -->
  <g transform="translate(600, 105)" text-anchor="middle">
    <!-- Category Pill Tag -->
    <g transform="translate(0, 0)">
      <rect x="-140" y="-18" width="280" height="32" rx="16" fill="rgba(99, 102, 241, 0.18)" stroke="#6366f1" stroke-opacity="0.5" stroke-width="1"/>
      <text x="0" y="3" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="68" class="title-text" filter="url(#glow)">Awesome AI Agent Frameworks</text>
    <text x="0" y="68" class="title-text">Awesome AI Agent Frameworks</text>

    <!-- Subtitle Line 1 -->
    <text x="0" y="112" class="subtitle-text">The Ultimate Directory for Autonomous Agents &amp; Multi-Agent Orchestration</text>

    <!-- Decorative Gradient Divider -->
    <rect x="-240" y="132" width="480" height="3" rx="1.5" fill="url(#primary-glow)"/>

    <!-- Key highlights pill strip below title -->
    <g transform="translate(0, 165)">
      <!-- Pill 1 -->
      <g transform="translate(-230, 0)">
        <rect x="0" y="-14" width="135" height="28" rx="14" fill="#13172e" stroke="#334155" stroke-width="1"/>
        <text x="67" y="4" class="badge-text" text-anchor="middle" font-size="12">🤖 Multi-Agent</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-80, 0)">
        <rect x="0" y="-14" width="160" height="28" rx="14" fill="#13172e" stroke="#334155" stroke-width="1"/>
        <text x="80" y="4" class="badge-text" text-anchor="middle" font-size="12">⚡ Stateful Graphs</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(95, 0)">
        <rect x="0" y="-14" width="145" height="28" rx="14" fill="#13172e" stroke="#334155" stroke-width="1"/>
        <text x="72" y="4" class="badge-text" text-anchor="middle" font-size="12">🛠️ Tool Augmentation</text>
      </g>
    </g>
  </g>
</svg>
